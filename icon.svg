<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" rx="7" fill="#0a0f1e"/>
  <!-- 3x3 grid mark — plus/cross pattern -->
  <!-- Row 0 -->
  <rect x="4"  y="4"  width="7" height="7" rx="1.5" fill="#3b82f6" fill-opacity="0.18"/>
  <rect x="12.5" y="4"  width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <rect x="21" y="4"  width="7" height="7" rx="1.5" fill="#3b82f6" fill-opacity="0.18"/>
  <!-- Row 1 -->
  <rect x="4"  y="12.5" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <rect x="12.5" y="12.5" width="7" height="7" rx="1.5" fill="#93c5fd"/>
  <rect x="21" y="12.5" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <!-- Row 2 -->
  <rect x="4"  y="21" width="7" height="7" rx="1.5" fill="#3b82f6" fill-opacity="0.18"/>
  <rect x="12.5" y="21" width="7" height="7" rx="1.5" fill="#3b82f6"/>
  <rect x="21" y="21" width="7" height="7" rx="1.5" fill="#3b82f6" fill-opacity="0.18"/>
</svg>
